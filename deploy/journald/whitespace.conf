# Installed as /etc/systemd/journald.conf.d/whitespace.conf (see docs/runbooks/deploy-server.md).
#
# On 2026-10-09 the 38 GB disk filled: every service line was written twice, once to the
# journal and once, via ForwardToSyslog, to /var/log/syslog, which logrotate only rotates
# weekly. RPC rate-limit stack traces from the indexer and bots grew syslog to 28 GB, Postgres
# could no longer write WAL and went into a crash/recovery loop, and the whole site returned
# 500s. The journal is the one copy now, and it is capped.
[Journal]
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=14day
ForwardToSyslog=no
RateLimitIntervalSec=30s
RateLimitBurst=2000
