# Postgres for the indexer and the read API. Nothing else runs in Docker — the five Node
# services are supervised by `tools/stack/run.mjs`, which keeps their logs, restarts and
# readiness gates in one place and needs no image builds.
#
# Port 5433, not 5432, on purpose. A developer machine usually already has a system
# Postgres on 5432 serving unrelated projects, and this stack must not have to share it or
# compete for it. (On the machine this was first brought up on, the system instance also
# had a glibc collation-version mismatch that blocked `createdb` entirely — an isolated
# container sidesteps that class of problem rather than requiring a fix to someone's
# unrelated databases.)
#
#   docker compose up -d postgres     # start
#   docker compose down               # stop, keep data
#   docker compose down -v            # stop and DESTROY the indexed data
#
# The indexer can rebuild everything it owns from chain, so the volume is a cache, not a
# system of record. Dropping it costs a resync, not data.

services:
  postgres:
    image: postgres:16-alpine
    container_name: whitespace-postgres
    restart: unless-stopped
    # MEMORY BUDGET (production: 2 GB RAM, 1 vCPU, 2 GB swap — every limit below and the
    # MemoryHigh/MemoryMax of each deploy/systemd unit are sized together, and
    # deploy/test/memoryBudget.test.mjs fails if they stop adding up).
    #
    # Postgres ran with stock settings and no limit beside eight Node processes. When the
    # box ran short the kernel OOM killer picked a Postgres backend, the postmaster then
    # restarted every backend through crash recovery, every client reconnected at once,
    # and the box ran short again: the recovery loop production was stuck in.
    #   - explicit, small settings so its footprint is known: max_connections covers the
    #     indexer (12), API (10), two bots (2 each) and psql/backup with room to spare;
    #     shared_buffers 128MB; work_mem 4MB per sort/hash;
    #   - oom_score_adj -900 makes it the LAST thing the kernel kills — a Node unit is
    #     restarted by systemd in seconds, Postgres takes everything down with it;
    #   - mem_limit caps it, and memswap_limit lets it page under pressure instead of
    #     being OOM-killed inside its own cgroup, which would restart the same loop;
    #   - shm_size: Docker's 64 MB /dev/shm is below what parallel workers can request.
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
    mem_limit: 600m
    memswap_limit: 1200m
    oom_score_adj: -900
    shm_size: 128m
    environment:
      POSTGRES_USER: whitespace
      POSTGRES_PASSWORD: whitespace
      POSTGRES_DB: whitespace
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - whitespace-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone reports true while the container is still running its
      # first-boot init scripts, so a dependent that trusts it can connect and find no
      # database. Ask for an actual query against the actual database instead.
      test: ['CMD-SHELL', 'psql -U whitespace -d whitespace -c "SELECT 1" || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  # Caching JSON-RPC proxy for browser traffic only — the indexer and keeper keep talking
  # to the upstream directly, because their access pattern is chunked `eth_getLogs` over
  # historical ranges, which a response cache does nothing for. See deploy/erpc.yaml for
  # why this exists and what to do if it misbehaves against 1874.
  #
  # Published on 4001, not its default 4000, which would collide with services/api.
  # Only started in the hosted deployment; local development does not need it, and
  # `docker compose up -d postgres` still brings up Postgres alone.
  #
  # Pinned, not `latest`: a `docker compose pull` or a fresh box must not silently move to a
  # release nobody has run against deploy/erpc.yaml. 0.3.0 is the release `latest` resolved
  # to when this was pinned (same digest, checked 2026-10-10). Upgrading is a deliberate
  # edit here followed by a check of /rpc.
  #
  # Part of the memory budget above; a Go proxy with an in-memory cache, capped so the
  # cache cannot grow into the room Postgres and the Node units are counting on.
  erpc:
    image: ghcr.io/erpc/erpc:0.3.0
    container_name: whitespace-erpc
    restart: unless-stopped
    mem_limit: 160m
    ports:
      - '127.0.0.1:4001:4000'
    volumes:
      - ./deploy/erpc.yaml:/root/erpc.yaml:ro
    profiles: ['hosted']

volumes:
  whitespace-pgdata:
