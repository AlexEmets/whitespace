<!--
  Tab icon. Next.js App Router serves any `app/icon.*` as the favicon automatically, so
  this file needs no registration in layout.tsx and no <link rel="icon">.

  SVG rather than a raster .ico on purpose: the mark stays sharp at every tab and bookmark
  size instead of shipping several PNG sizes, and its colours stay editable as text.

  The mark is the header's (src/lib/brandMark.ts), copied by hand because this file is
  static: the same 64-unit geometry, scaled onto the 512 tile by the group transform, in
  the Solar theme's colours. The tile does not follow the theme — a favicon is drawn
  before any page script runs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow">
      <stop offset="0.55" stop-color="#ffc37a" stop-opacity="0" />
      <stop offset="0.66" stop-color="#ffc37a" stop-opacity="0.6" />
      <stop offset="1" stop-color="#ffc37a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#fff4e0" />
      <stop offset="1" stop-color="#ffc37a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="7" y="7" width="498" height="498" rx="118" fill="#08080a" stroke="#2b2c33" stroke-width="14" />
  <g transform="translate(16 16) scale(7.5)">
    <circle cx="32" cy="32" r="30" fill="url(#glow)" />
    <circle cx="32" cy="32" r="19" fill="#030305" stroke="#ffd6a0" stroke-width="1.8" />
    <circle cx="45.4" cy="18.6" r="8" fill="url(#flare)" />
    <path d="M45.4 11.2 L46.3 17.7 L52.8 18.6 L46.3 19.5 L45.4 26 L44.5 19.5 L38 18.6 L44.5 17.7 Z" fill="#fff4e0" />
  </g>
</svg>
